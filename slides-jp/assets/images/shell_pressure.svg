<svg width="100%" viewBox="0 0 720 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
<title>星の表面(球殻)での圧力</title>
<desc>半径 r の星における厚さ dr の球殻(膜)にはたらく圧力。内側から外側へ働く力 P(r) と、外側から内側へ働く力 P(r+dr) を示す。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#EF9F27" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#EF9F27" stop-opacity="0.15"/>
</linearGradient>
</defs>

<!-- Title -->
<text x="360" y="36" text-anchor="middle" fill="#141413" font-size="19" font-weight="600">星の表面(球殻)での圧力</text>
<text x="360" y="58" text-anchor="middle" fill="#3D3D3A" font-size="13">半径 r の星の、厚さ dr の膜にはたらく力</text>

<!-- ============ Left: whole star ============ -->
<!-- Star body -->
<circle cx="170" cy="305" r="135" fill="url(#core)" stroke="#BA7517" stroke-width="0.5"/>
<!-- Representative shell (membrane) ring at radius r -->
<circle cx="170" cy="305" r="98" fill="none" stroke="#E8825F" stroke-width="16" opacity="0.85"/>
<circle cx="170" cy="305" r="90" fill="none" stroke="#993C1D" stroke-width="0.8" opacity="0.7"/>
<circle cx="170" cy="305" r="106" fill="none" stroke="#993C1D" stroke-width="0.8" opacity="0.7"/>

<!-- Centre marker -->
<circle cx="170" cy="305" r="2.5" fill="#854F0B"/>
<text x="178" y="320" fill="#633806" font-size="12">r = 0</text>

<!-- Radius indicator (to shell, up-right ~ -45deg) -->
<line x1="170" y1="305" x2="239" y2="236" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="196" y="262" fill="#444441" font-size="13" font-style="italic">r</text>

<!-- Shell label -->
<text x="170" y="180" text-anchor="middle" fill="#993C1D" font-size="12">厚さ dr の膜(球殻)</text>
<line x1="170" y1="186" x2="170" y2="206" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="2 3"/>

<!-- Zoom source highlight on ring (top-right) -->
<rect x="225" y="218" width="34" height="22" rx="3" transform="rotate(-45 242 229)" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<!-- Zoom connectors to right panel -->
<line x1="262" y1="208" x2="430" y2="120" stroke="#9A9A95" stroke-width="0.8" stroke-dasharray="3 4"/>
<line x1="258" y1="252" x2="430" y2="420" stroke="#9A9A95" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="300" y="262" fill="#9A9A95" font-size="11">拡大</text>

<!-- ============ Right: zoomed membrane ============ -->
<!-- panel frame -->
<rect x="430" y="120" width="270" height="300" rx="10" fill="#FBFAF7" stroke="#D8D7D2" stroke-width="1"/>

<!-- Region labels -->
<text x="565" y="148" text-anchor="middle" fill="#5F5E5A" font-size="12">外側(半径 r + dr の方向)</text>
<text x="565" y="400" text-anchor="middle" fill="#5F5E5A" font-size="12">中心方向(半径 0 の方向)</text>

<!-- Inward pressure P(r+dr): blue arrows pushing DOWN onto outer face -->
<line x1="505" y1="168" x2="505" y2="232" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="565" y1="168" x2="565" y2="232" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="625" y1="168" x2="625" y2="232" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="164" text-anchor="middle" fill="#0C447C" font-size="14" font-weight="500">P(r+dr):外側 → 内側</text>

<!-- Membrane slab (thickness dr) -->
<rect x="460" y="236" width="210" height="36" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>
<text x="565" y="259" text-anchor="middle" fill="#4A1B0C" font-size="13">膜(厚さ dr)</text>

<!-- dr bracket on the left -->
<line x1="448" y1="236" x2="448" y2="272" stroke="#633806" stroke-width="1"/>
<line x1="444" y1="236" x2="452" y2="236" stroke="#633806" stroke-width="1"/>
<line x1="444" y1="272" x2="452" y2="272" stroke="#633806" stroke-width="1"/>
<text x="440" y="258" text-anchor="end" fill="#633806" font-size="13" font-style="italic">dr</text>

<!-- Outward pressure P(r): green arrows pushing UP onto inner face -->
<line x1="505" y1="340" x2="505" y2="276" stroke="#3B6D11" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="565" y1="340" x2="565" y2="276" stroke="#3B6D11" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="625" y1="340" x2="625" y2="276" stroke="#3B6D11" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="362" text-anchor="middle" fill="#27500A" font-size="14" font-weight="500">P(r):内側 → 外側</text>

<!-- Bottom note -->
<text x="360" y="458" text-anchor="middle" fill="#5F5E5A" font-size="12">膜の内外にはたらく圧力の差が、膜にはたらく正味の力を決める</text>
</svg>
