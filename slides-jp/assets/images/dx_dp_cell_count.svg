<svg width="100%" viewBox="0 75 682.9 310.31" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Counting cells within dx by dp region of phase space</title>
<desc>A schematic of phase space (x, p): a finite rectangular region of width dx and height dp is highlighted; it contains a 4 by 3 grid of unit cells, each of area h, each filled with 2 electrons of opposite spin. The number of states is dN = (2/h) dx dp.</desc>

<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Axes -->
<line x1="100" y1="320" x2="600" y2="320" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="100" y1="320" x2="100" y2="100" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<text x="608" y="324" fill="#444441" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">x (position)</text>
<text x="100" y="92" text-anchor="middle" fill="#444441" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">p (momentum)</text>

<!-- Background grid -->
<g stroke="#B4B2A9" stroke-width="0.4" fill="none">
  <line x1="160" y1="320" x2="160" y2="120"/>
  <line x1="220" y1="320" x2="220" y2="120"/>
  <line x1="280" y1="320" x2="280" y2="120"/>
  <line x1="340" y1="320" x2="340" y2="120"/>
  <line x1="400" y1="320" x2="400" y2="120"/>
  <line x1="460" y1="320" x2="460" y2="120"/>
  <line x1="520" y1="320" x2="520" y2="120"/>
  <line x1="100" y1="280" x2="560" y2="280"/>
  <line x1="100" y1="240" x2="560" y2="240"/>
  <line x1="100" y1="200" x2="560" y2="200"/>
  <line x1="100" y1="160" x2="560" y2="160"/>
  <line x1="100" y1="120" x2="560" y2="120"/>
</g>

<!-- Highlighted finite region: 4 columns x 3 rows, each cell = h -->
<rect x="160" y="160" width="240" height="120" fill="#CECBF6" fill-opacity="0.55" stroke="#534AB7" stroke-width="1.2"/>

<!-- Internal cell divisions of highlighted region (drawn darker for clarity) -->
<g stroke="#534AB7" stroke-width="0.5" fill="none" opacity="0.7">
  <line x1="220" y1="160" x2="220" y2="280"/>
  <line x1="280" y1="160" x2="280" y2="280"/>
  <line x1="340" y1="160" x2="340" y2="280"/>
  <line x1="160" y1="200" x2="400" y2="200"/>
  <line x1="160" y1="240" x2="400" y2="240"/>
</g>

<!-- Electrons: 2 per cell (spin up + spin down), 12 cells = 24 dots -->
<g font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif">
  <!-- Row 1 (top, y center = 180) -->
  <circle cx="178" cy="180" r="5" fill="#185FA5"/>
  <text x="178" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="202" cy="180" r="5" fill="#185FA5"/>
  <text x="202" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="238" cy="180" r="5" fill="#185FA5"/>
  <text x="238" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="262" cy="180" r="5" fill="#185FA5"/>
  <text x="262" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="298" cy="180" r="5" fill="#185FA5"/>
  <text x="298" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="322" cy="180" r="5" fill="#185FA5"/>
  <text x="322" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="358" cy="180" r="5" fill="#185FA5"/>
  <text x="358" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="382" cy="180" r="5" fill="#185FA5"/>
  <text x="382" y="184" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>

  <!-- Row 2 (middle, y center = 220) -->
  <circle cx="178" cy="220" r="5" fill="#185FA5"/>
  <text x="178" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="202" cy="220" r="5" fill="#185FA5"/>
  <text x="202" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="238" cy="220" r="5" fill="#185FA5"/>
  <text x="238" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="262" cy="220" r="5" fill="#185FA5"/>
  <text x="262" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="298" cy="220" r="5" fill="#185FA5"/>
  <text x="298" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="322" cy="220" r="5" fill="#185FA5"/>
  <text x="322" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="358" cy="220" r="5" fill="#185FA5"/>
  <text x="358" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="382" cy="220" r="5" fill="#185FA5"/>
  <text x="382" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>

  <!-- Row 3 (bottom, y center = 260) -->
  <circle cx="178" cy="260" r="5" fill="#185FA5"/>
  <text x="178" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="202" cy="260" r="5" fill="#185FA5"/>
  <text x="202" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="238" cy="260" r="5" fill="#185FA5"/>
  <text x="238" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="262" cy="260" r="5" fill="#185FA5"/>
  <text x="262" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="298" cy="260" r="5" fill="#185FA5"/>
  <text x="298" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="322" cy="260" r="5" fill="#185FA5"/>
  <text x="322" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
  <circle cx="358" cy="260" r="5" fill="#185FA5"/>
  <text x="358" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↑</text>
  <circle cx="382" cy="260" r="5" fill="#185FA5"/>
  <text x="382" y="264" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="500">↓</text>
</g>

<!-- dx bracket (below x-axis) -->
<line x1="160" y1="338" x2="400" y2="338" stroke="#444441" stroke-width="0.5"/>
<line x1="160" y1="335" x2="160" y2="341" stroke="#444441" stroke-width="0.5"/>
<line x1="400" y1="335" x2="400" y2="341" stroke="#444441" stroke-width="0.5"/>
<text x="280" y="354" text-anchor="middle" fill="#444441" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">dx</text>

<!-- dp bracket (right of region) -->
<line x1="418" y1="160" x2="418" y2="280" stroke="#444441" stroke-width="0.5"/>
<line x1="415" y1="160" x2="421" y2="160" stroke="#444441" stroke-width="0.5"/>
<line x1="415" y1="280" x2="421" y2="280" stroke="#444441" stroke-width="0.5"/>
<text x="428" y="224" fill="#444441" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">dp</text>

<!-- Annotation box (right side) -->
<text x="455" y="178" fill="#3C3489" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">cells in region = dx · dp / h</text>
<text x="455" y="200" fill="#3C3489" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">2 electrons per cell</text>
<text x="455" y="226" fill="#3C3489" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600">⇒ dN = (2/h) dx dp</text>

<!-- Bottom note -->
<text x="340" y="372" text-anchor="middle" fill="#5F5E5A" font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="12">Counting filled cells in a finite phase-space region</text>
</svg>
