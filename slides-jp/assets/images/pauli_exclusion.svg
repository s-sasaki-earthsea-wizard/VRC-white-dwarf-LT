<svg width="100%" viewBox="0 0 700 400" role="img"
  style="font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;"
  xmlns="http://www.w3.org/2000/svg">
<title>Pauli exclusion principle in phase space</title>
<desc>One phase-space cell holds at most two electrons of opposite spin. A third electron is rejected and must occupy a higher-momentum cell.</desc>

<defs>
  <marker id="pauli-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Titles -->
<text x="350" y="32" text-anchor="middle" fill="#141413" font-size="15" font-weight="500">パウリの排他律 ― 同じセルには電子は2個まで</text>
<text x="350" y="54" text-anchor="middle" fill="#5F5E5A" font-size="12">スピンが上下に異なれば共存できるが、3個目は入れず、より高い運動量のセルへ追いやられる</text>

<!-- Momentum axis -->
<line x1="70" y1="350" x2="70" y2="100" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#pauli-arrow)"/>
<text x="70" y="90" text-anchor="middle" fill="#444441" font-size="12">p（運動量）</text>
<text x="50" y="170" text-anchor="middle" fill="#5F5E5A" font-size="11">高</text>
<text x="50" y="300" text-anchor="middle" fill="#5F5E5A" font-size="11">低</text>

<!-- Upper cell (higher momentum, has the relocated electron) -->
<rect x="150" y="160" width="160" height="80" fill="#F0EFEA" stroke="#B4B2A9" stroke-width="1"/>
<text x="320" y="186" fill="#5F5E5A" font-size="11">高い運動量のセル</text>
<text x="320" y="202" fill="#5F5E5A" font-size="11">（空いている）</text>
<!-- relocated electron: dashed ghost destination -->
<circle cx="230" cy="200" r="12" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="230" y="205" text-anchor="middle" fill="#185FA5" font-size="13" font-weight="500">↑</text>

<!-- Lower cell (lower momentum, full) -->
<rect x="150" y="240" width="160" height="80" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<circle cx="205" cy="280" r="12" fill="#185FA5"/>
<text x="205" y="285" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="500">↑</text>
<circle cx="255" cy="280" r="12" fill="#185FA5"/>
<text x="255" y="285" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="500">↓</text>
<!-- OK check -->
<path d="M282 256 l5 6 l9 -12" fill="none" stroke="#2D7D46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="230" y="340" text-anchor="middle" fill="#2D7D46" font-size="12" font-weight="500">満席（2個でOK）</text>

<!-- Third electron approaching -->
<circle cx="470" cy="280" r="12" fill="#185FA5"/>
<text x="470" y="285" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="500">↑</text>
<text x="470" y="312" text-anchor="middle" fill="#444441" font-size="12">3個目の電子</text>

<!-- Rejected: dashed red arrow into full cell, blocked by X -->
<line x1="452" y1="280" x2="388" y2="280" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#pauli-arrow)"/>
<g stroke="#C0392B" stroke-width="2.6" stroke-linecap="round">
  <line x1="356" y1="270" x2="372" y2="290"/>
  <line x1="372" y1="270" x2="356" y2="290"/>
</g>
<text x="364" y="252" text-anchor="middle" fill="#C0392B" font-size="12" font-weight="500">入れない</text>

<!-- Relocation: curved arrow from third electron up to upper cell -->
<path d="M474 263 C 500 200, 470 150, 326 178" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#pauli-arrow)"/>
<text x="540" y="206" fill="#3C3489" font-size="12">より高い運動量の</text>
<text x="540" y="222" fill="#3C3489" font-size="12">空きセルへ移る</text>

<!-- Legend -->
<text x="350" y="384" text-anchor="middle" fill="#5F5E5A" font-size="11">● 電子（矢印はスピンの向き：↑ と ↓ の2状態）</text>
</svg>
