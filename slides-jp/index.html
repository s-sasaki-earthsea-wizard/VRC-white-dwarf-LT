### 太陽は最後どうなるのか?

<div class="simple-box">

* 太陽は水素の核融合で燃えている: 
  * $4 ^1 H \rightarrow ^4 He + 2 e^+ + 2 \nu_e + 26.7 \text{MeV}$
* 太陽はあと約50億年で水素を使い切る
* 膨張して赤色巨星に (燃え尽きる前の最後の輝き)
* そして最終形態「白色矮星」になり萎んでいく

</div>

### 太陽の最終形態: 白色矮星

<div class="simple-box">

* 太陽の質量を **地球サイズ** に圧縮した天体
* 核融合は停止 — つまり「燃え尽きた星」
* それでも何百億年も潰れずに静かに光り続ける

</div>

## 太陽の大きさはどうやって決まるのか？

---

### 重力と圧力のつり合い

<div class="simple-box">

* 星は **自分の重力** で潰れようとする
* それに対抗するのが **ガスの圧力**
* 圧力を保つには熱が必要 → 核融合が熱を供給
* **重力と圧力のつり合いで星は形を保つ**

</div>

<img src="assets/images/white_dwarf_hydrostatic_balance.svg" height="380px">

---

### 風船で考えてみる

<div class="simple-box">

* 風船を氷水で冷やすと **萎む**
* 風船をお湯で温めると **膨らむ**
  * 気体の圧力は **熱(分子の運動)** から生まれる
  * 冷えると分子が動かなくなり、圧力が下がる
  * 熱すると分子が活発に動き回り、圧力が上がる

</div>

<img src="assets/images/baloon-experiment.png" height="300px">

---

### 素朴な疑問: 燃え尽きた星は？

<div class="highlight-box">

* **燃え尽きた星はなぜ潰れないのか？**
* 熱を生まなければ、圧力は下がる
  * 重力でぺしゃんこに潰れて形を保てないはず

</div>

<br>

<div class="simple-box">

* でも潰れずに白色矮星が残る
* 熱がないのに、なぜ重力で潰れないのか？
  * 実は **別の力** が働いている...

</div>

## 静水圧平衡

---

### ニュートン力学での重力

<div class="simple-box">

* 重力は質量を持つ物体同士が引き合う力

</div>

<br>

<div class="highlight-box">
質点同士に働く力は

$$F = G \frac{m_1 m_2}{r^2}$$

半径 $r$ での加速度は

$$ g(r) = \frac{Gm(r)}{r^2} $$

</div>

---

### 星の表面での圧力

<div class="simple-box">

* 半径 $r$ の星の表面の厚さ $dr$ の膜を考える
* 膜の内側から外側へ働く力は $P(r)$
* 膜の外側から内側へ働く力は $P(r +dr)$

</div>

<img src="assets/images/shell_pressure.svg" height="400px">

---

### 静水圧平衡

<div class="simple-box">

内向きの力と外向きの力の釣り合いから:

$$ P(r) = P(r +dr) + \rho(r) \frac{Gm(r)}{r^2} dr$$
$$ \Rightarrow \frac{dP}{dr} = -\frac{G m(r) \rho(r)}{r^2}$$

</div>

<br>

<div class="highlight-box">

* 形を維持した星で重力と圧力が満たしている関係
* **静水圧平衡**

</div>

---

### 太陽の圧力源: 核融合の熱

<div class="simple-box">

* 静水圧平衡の式は「何が圧力を生むのか？」は一切議論していない
* 太陽は水素の核融合の熱が圧力を生んでいる

</div>

<img src="assets/images/Fusion_in_the_Sun.svg.png" height="400px">

---

### ようこそ...『量子の世界』へ...

<div class="simple-box">

* 「圧力 = 熱」の **古典物理** では燃え尽きて熱を生まない白色矮星を説明できない
* **ようこそ...『量子の世界へ』...**

## 電子縮退圧

---

### 静水圧平衡の振り返り

<div class="simple-box">

* 重力と圧力の釣り合いを記述
* 何が圧力を生むのか、は一切触れていない
* **何が圧力源なのかに寄らず成立する**

</div>

<br>

<div class="highlight-box">

$$ \frac{dP}{dr} = -\frac{G m(r) \rho(r)}{r^2}$$

</div>

---

### パウリの排他律

<div class="simple-box">

* 電子は **同じ状態に2個入れない**
* 「席」が決まっていて、1つの席には1個まで
* これは量子力学の基本原理

</div>

<!-- TODO: 席取りイメージ図 -->

Note:
量子状態(エネルギー・運動量・スピン)を「席」と表現。

---

### 席取りゲーム

<div class="simple-box">

* 低い席から順番に埋まっていく
* 全部の席が埋まると、後から来た電子は **嫌でも高い席** に座らされる
* 「高い席」= 高い運動量 = 速く動く電子

</div>

Note:
強引でも電子を詰め込むと、高運動量電子が必然的に生じる。

---

### 縮退圧の正体

<div class="simple-box">

* 詰め込まれた電子は、温度に関係なく動き回っている
* これが **圧力** を生む
* これを **電子縮退圧** と呼ぶ

</div>

<br>

<div class="highlight-box">

温度に依存しない圧力<br>
→ 冷えても消えない

</div>

---

### 白色矮星を支える力

<div class="simple-box">

* 白色矮星の中では電子が極端に詰め込まれている
* パウリの排他律によって、嫌でも高い運動量を持つ
* この **量子力学的な圧力** が重力を支えている

</div>
