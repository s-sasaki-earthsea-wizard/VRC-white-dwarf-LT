### 太陽は最後どうなるのか?

<div class="simple-box">

* 太陽は水素の核融合で燃えている
* 太陽はあと約50億年で水素を使い切る
* 膨張して赤色巨星に (燃え尽きる前の最後の輝き)
* そして最終形態「白色矮星」になり萎んでいく

</div>

<img src="assets/images/Sun_poster.svg.png" height="300px">

<div class="caption"> Credit: Kelvinsong </div>

---

### 太陽の最終形態:白色矮星

<div class="simple-box">

* 太陽の質量を **地球サイズ** に圧縮した天体
* 核融合は停止 — つまり「燃え尽きた星」
* それでも何百億年も潰れずに静かに光り続ける

</div>

<img src="assets/images/Sirius_A_and_B_Hubble_photo.editted.png" height="350px">
<br>
<div class="caption"> Credit: NASA. 左下の小さな星が白色矮星、シリウスB</div>

### 素朴な疑問

<br>

<div class="highlight-box">

燃え尽きた星が、<br>
なぜ潰れずに残れるのか?

</div>

Note:
ここで一度ためる。聴衆に「言われてみれば確かに」と思わせる。

---

### 風船で考えてみる

<div class="simple-box">

* 風船を冷蔵庫に入れると **萎む**
* 気球はバーナーで温めると **膨らむ**
  * 気体の圧力は **熱(分子の運動)** から生まれる
  * 冷えると分子が動かなくなり、圧力が下がる
  * 熱すると分子が活発に動き回り、圧力が上がる

</div>

<img src="assets/images/baloon-experiment.png" height="300px">

---

### 太陽も同じ理屈

<div class="simple-box">

* 星は **自分の重力** で潰れようとする
* それに対抗するのが **ガスの圧力**
* 圧力を保つには熱が必要 → 核融合が熱を供給
* **重力と圧力の釣り合いで星のサイズが決まる**

</div>

<img src="assets/images/white_dwarf_hydrostatic_balance.svg" height="380px">

---

### では、燃え尽きた星は?

<div class="highlight-box">

熱を生まなければ、圧力は下がる<br>
→ 重力に負けて潰れるはず

</div>

<br>

<div class="simple-box">

* でも白色矮星は、宇宙の年齢より長く、潰れずに残る
* 熱がないのに、なぜ重力で潰れないのか？
  * 実は 別の力 が働いている...
  * 古典物理では答えが出ない

</div>

---

### 本題

<div class="highlight-box">

* 答えは「電子の不思議な振る舞い」が生み出す圧力
  * 電子縮退圧
* 量子力学が星を支えている

</div>

<br>

<div class="simple-box">

* 大きな星と小さな世界の物理の交差点が白色矮星
* 今日のテーマ:**量子力学 × 天体物理 × 流体力学** の交差点

</div>

## ステージ1
### 普通の星はなぜ潰れないのか

---

### 重力と圧力のバランス

<div class="simple-box">

* 星の内部:重力で内側に引っ張られる
* ガスの圧力:外向きに押し返す
* この **釣り合い** によって星は形を保つ

</div>

<!-- TODO: 重力 vs 圧力勾配の概念図 -->

---

### 静水圧平衡

<div class="simple-box">

各位置で、内向きの重力と外向きの圧力勾配が釣り合う:

</div>

`$$\frac{dP}{dr} = -\frac{G M(r) \rho(r)}{r^2}$$`

<div class="highlight-box">

※ 数式の中身よりも、「**力が釣り合っている**」イメージが重要

</div>

Note:
数式は提示するだけで深入りしない。図で補足。

---

### 核融合の役割

<div class="simple-box">

* 圧力を保つには、**熱を補給し続ける** 必要がある
* 熱が冷めれば → 圧力が下がる → 重力が勝つ → 縮む
* 太陽は今、水素核融合で熱を生み続けている

</div>

<!-- TODO: 核融合のイメージ図 -->

---

### フィードバック構造

<div class="simple-box">

* 縮むと中心が熱くなり、核融合が活発化
* → 圧力が上がり、また膨らむ
* → 自動的に安定する「自己制御」

</div>

Note:
重力と熱の動的平衡。詳しく入らずに「賢い仕組み」として印象付け。

---

### ここまでの世界

<div class="highlight-box">

「圧力 = 熱」の **古典物理** の世界

</div>

<br>

<div class="simple-box">

次のステージで、この常識が破綻する

</div>

## ステージ2
### 燃え尽きるとどうなるはずか

---

### 燃料が尽きる = 熱供給が止まる

<div class="simple-box">

* 核融合の燃料(水素・ヘリウム等)を使い切る
* もう熱は生まれない
* 古典物理の論理では:**冷えて、圧力が下がり、潰れる** はず

</div>

---

### でも、観測される白色矮星

<div class="simple-box">

* 銀河系には数千億個の白色矮星が存在
* どれも安定に存在し、潰れていない
* しかも **地球サイズ** に圧縮されたまま

</div>

<br>

<div class="highlight-box">

古典物理では説明できない

</div>

---

### 何が支えているのか?

<br>

<div class="highlight-box">

熱ではない、別の圧力がある<br>
→ それは「電子」が生み出している

</div>

---

## ステージ3
### 量子力学の登場

---

### パウリの排他律

<div class="simple-box">

* 電子は **同じ状態に2個入れない**
* 「席」が決まっていて、1つの席には1個まで
* これは量子力学の基本原理

</div>

<!-- TODO: 席取りイメージ図 -->

Note:
量子状態(エネルギー・運動量・スピン)を「席」と表現。

---

### 席取りゲーム

<div class="simple-box">

* 低い席から順番に埋まっていく
* 全部の席が埋まると、後から来た電子は **嫌でも高い席** に座らされる
* 「高い席」= 高い運動量 = 速く動く電子

</div>

Note:
強引でも電子を詰め込むと、高運動量電子が必然的に生じる。

---

### 縮退圧の正体

<div class="simple-box">

* 詰め込まれた電子は、温度に関係なく動き回っている
* これが **圧力** を生む
* これを **電子縮退圧** と呼ぶ

</div>

<br>

<div class="highlight-box">

温度に依存しない圧力<br>
→ 冷えても消えない

</div>

---

### 白色矮星を支える力

<div class="simple-box">

* 白色矮星の中では電子が極端に詰め込まれている
* パウリの排他律によって、嫌でも高い運動量を持つ
* この **量子力学的な圧力** が重力を支えている

</div>

<!-- TODO: 白色矮星内部のイメージ図 -->

---

### 改めて静水圧平衡

<div class="simple-box">

* 普通の星:**熱的ガス圧** vs 重力
* 白色矮星:**電子縮退圧** vs 重力

</div>

<br>

<div class="highlight-box">

支えるものが「熱」から「量子統計」に置き換わっただけ<br>
釣り合いの構造は同じ

</div>

---

### 量子力学 × 天体物理 × 流体力学

<div class="simple-box">

* **量子力学**:パウリの排他律が電子の振る舞いを決める
* **天体物理**:星の構造と進化の最終段階
* **流体力学**:静水圧平衡という釣り合いの記述

</div>

<br>

<div class="highlight-box">

ミクロな量子の話が、マクロな星の構造を決めている

</div>

### まとめ

<div class="simple-box">

1. 普通の星は **核融合の熱** で重力を支える
2. 燃え尽きた星は熱がないので潰れる **はず**
3. でも白色矮星は **電子縮退圧** で支えられている
4. 温度に依存しない、量子力学が生む圧力

</div>

<br>

<div class="highlight-box">

白色矮星は「**量子統計が支える星**」
