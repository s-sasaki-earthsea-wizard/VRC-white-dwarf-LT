### 太陽は最後どうなるのか?

<div class="simple-box">

* 太陽は水素の核融合で燃えている: 
  * $4 ^1 H \rightarrow ^4 He + 2 e^+ + 2 \nu_e + 26.7 \text{MeV}$
* 太陽はあと約50億年で水素を使い切る
* 膨張して赤色巨星に (燃え尽きる前の最後の輝き)
* そして最終形態「白色矮星」になり萎んでいく

</div>

<div class="simple-box">

* 太陽の質量を **地球サイズ** に圧縮した天体
* 核融合は停止 — つまり「燃え尽きた星」
* それでも何百億年も潰れずに静かに光り続ける

## 太陽の大きさはどうやって決まるのか？

---

### 重力と圧力のつり合い

<div class="simple-box">

* 星は **自分の重力** で潰れようとする
* それに対抗するのが **ガスの圧力**
* 圧力を保つには熱が必要 → 核融合が熱を供給
* **重力と圧力のつり合いで星は形を保つ**

</div>

<img src="assets/images/white_dwarf_hydrostatic_balance.svg" height="380px">

---

### 風船で考えてみる

<div class="simple-box">

* 風船を氷水で冷やすと **萎む**
* 風船をお湯で温めると **膨らむ**
  * 気体の圧力は **熱(分子の運動)** から生まれる
  * 冷えると分子が動かなくなり、圧力が下がる
  * 熱すると分子が活発に動き回り、圧力が上がる

</div>

<img src="assets/images/baloon-experiment.png" height="300px">

---

<div class="highlight-box">

* **燃え尽きた星はなぜ潰れないのか？**
* 熱を生まなければ、圧力は下がる
  * 重力でぺしゃんこに潰れて形を保てないはず

</div>

<br>

<div class="simple-box">

* でも潰れずに白色矮星が残る
* 熱がないのに、なぜ重力で潰れないのか？
  * 実は **別の力** が働いている...

</div>

## 静水圧平衡

---

### ニュートン力学での重力

<div class="simple-box">

* 重力は質量を持つ物体同士が引き合う力

</div>

<br>

<div class="highlight-box">
質点同士に働く力は

$$F = G \frac{m_1 m_2}{r^2}$$

半径 $r$ での加速度は

$$ g(r) = \frac{Gm(r)}{r^2} $$

</div>

---

### 球殻に生じる圧力

<div class="simple-box">

* 半径 $r$ の厚さ $dr$ の膜を考える (球殻)
* 膜の内側から外側へ働く力は $P(r)$
* 膜の外側から内側へ働く力は $P(r +dr)$

</div>

<img src="assets/images/shell_pressure.svg" height="400px">

---

### 静水圧平衡

<div class="simple-box">

内向きの力と外向きの力の釣り合いから:

$$ P(r) = P(r +dr) + \rho(r) \frac{Gm(r)}{r^2} dr$$
$$ \Rightarrow \frac{dP}{dr} = -\frac{G m(r) \rho(r)}{r^2}$$

</div>

<br>

<div class="highlight-box">

* 形を維持した星で重力と圧力が満たしている関係
* **静水圧平衡**

</div>

---

### 太陽の圧力源: 核融合の熱

<div class="simple-box">

* 静水圧平衡の式は「何が圧力を生むのか？」は一切議論していない
* 太陽は水素の核融合の熱が圧力を生んでいる

</div>

<img src="assets/images/Fusion_in_the_Sun.svg.png" height="400px">

---

### ようこそ...『量子の世界』へ...

<div class="simple-box">

* 「圧力 = 熱」の **古典物理** では燃え尽きて熱を生まない白色矮星を説明できない
* **ようこそ...『量子の世界へ』...**

## 電子縮退圧

---

### 不確定性原理

<div class="simple-box">

* **量子の位置と運動量は広がりを持つ**
* 両者の分散の積は下限が存在する

</div>

<br>

<div class="highlight-box">

$$ \Delta x \Delta p \geq \frac{\hbar}{2}$$

</div>

---

### 視覚的に捉える不確定性原理

<div class="simple-box">

* 横軸に位置、縦軸に運動量を取る平面を考える
* \$\Delta x, \Delta p$ で格子を区切る
* **量子の位置と運動量は面では捉えられるが点では捉えられない**
* 長方形の面積 $\approx h$

</div>

<img src="assets/images/phase_space_cell.svg" height="350px">

---

### パウリの排他律

<div class="simple-box">

* 電子(などのフェルミオン)は位置、運動量、スピンのすべてが同一の状態を取れない
  * スピン(超ざっくり): 電子の角運動量、時計回りか反時計回りかのどっちか ($\pm \hbar$/2 )
* 位置と運動量で区切った格子の中に電子は2個までしか入らない (異なるスピンの向き)

</div>

---

### 電子の席取りゲーム

<div class="simple-box">

* 1つの格子は最大2個の電子しか入れない
* 格子が埋まっていると電子は別の格子に入らざるを得ない
* 電子を詰め込むと高い運動量を持つ電子が表れる

</div>

<img src="assets/images/pauli_exclusion.svg" height="370px">

---

### 電子縮退圧

<div class="simple-box">

* 詰め込まれた電子は冷めても消えない運動量を持つ (絶対零度でも！)
* 運動する電子が圧力を生む
  * これを **電子縮退圧** と呼ぶ

</div>

<img src="assets/images/fermi_sea_filling.svg" height="350px">

---

### 静水圧平衡の振り返り

<div class="simple-box">

* 普通の星: **熱的ガス圧** vs 重力
* 白色矮星: **電子縮退圧** vs 重力

$$ \frac{dP}{dr} = -\frac{G m(r) \rho(r)}{r^2}$$

</div>

<br>

<div class="highlight-box">

* **静水圧平衡**の式は圧力源に依存しない
* 圧力源が変わっただけで力の釣り合いの構造は同じ！

</div>

---

## フェルミ運動量

---

### 電子縮退圧とフェルミ運動量

<div class="simple-box">

* 電子は熱がなくても圧力を生み出す
* しかしどのくらいの数の電子が集まるとどのくらいの圧力になるかは一切議論していない
* 電子が生み出す圧力を考えていこう
* 電子の運動量の上限を考える
  * **フェルミ運動量**

</div>

---

### 座標3成分・運動量3成分の位相空間

<div class="simple-box">

位置: $\vec{r}=(x, y, z)$ <br>
運動量: $\vec{p}=(p_x, p_y, p_z)$

* 合計6成分の位相空間を考える

</div>

<br>

<div class="simple-box">

* 6成分の空間を格子で区切って1つ1つの格子に2つずつ電子が入っていく
  * $x$, $p$の2成分の時と考え方は同じ

</div>

---

### 位相空間セルと電子数

<div class="simple-box">

* 座標3成分・運動量3成分の最小セルの体積は $h^3$
* 1つのセルにスピンの異なる電子が2個入る (パウリの排他律)

</div>

<br>

<div class="highlight-box">

$$ dN = \frac{2}{h^3}\, d^3x\, d^3p $$

</div>

* 位相空間の微小体積要素 $d^3x\, d^3p$ の中に入る電子の数

---

### フェルミ球

<div class="simple-box">

* 位置 $\vec{x}$ を固定して考える
* 運動量$p_x, p_y, p_z$で張られる空間の球の内側から電子が埋まっていく
* この球を **フェルミ球** と呼ぶ

</div>

<img src="assets/images/fermi_sphere.svg" height="350px">

---

### フェルミ運動量

<div class="simple-box">

* フェルミ球の半径を *フェルミ運動量** $p_F$ と呼ぶ
* 電子の運動量の最大値

</div>

---

### フェルミ球に詰まる電子の数

<div class="simple-box">

* フェルミ球 ($|\vec{p}| \le p_F$) の内側を電子が埋め尽くす
* 体積 $V$ の中の電子数を $dN$ で積分して数える

$$ N = \frac{2}{h^3}\, V \int_{|\vec{p}|\le p_F} d^3p = \frac{2}{h^3}\, V \cdot \frac{4\pi}{3} p_F^3 $$

</div>

<br>

<div class="highlight-box">

数密度 $n_e = N/V$ は

$$ n_e = \frac{8\pi}{3h^3}\, p_F^3 $$

</div>

---

### 量子力学 × 天体物理 × 流体力学

<div class="simple-box">

* **量子力学**:パウリの排他律が電子の振る舞いを決める
* **天体物理**:星の構造と進化の最終段階
* **流体力学**:静水圧平衡という釣り合いの記述

</div>

<br>

<div class="highlight-box">

ミクロな量子の話が、マクロな星の構造を決めている

</div>
